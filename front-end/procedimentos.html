<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clínica Odontológica — Procedimentos</title>
  <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body>

  <div id="app-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <div class="conteudo">
      <header class="topbar">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-outline-secondary botao-menu" id="btn-menu">
            <i class="bi bi-list"></i>
          </button>
          <h1 id="titulo-pagina" class="titulo-pagina"></h1>
        </div>
        <div class="usuario-box">
          <span id="usuario-logado" class="usuario-logado"></span>
          <button class="btn btn-sm btn-outline-secondary" id="btn-sair">
            <i class="bi bi-box-arrow-right"></i> Sair
          </button>
        </div>
      </header>

      <main class="area-conteudo">
        <div class="card">
          <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div>
              <h5 class="mb-0">Catálogo de procedimentos</h5>
              <small class="text-secondary"><span id="total-registros">0</span> registro(s) encontrado(s)</small>
            </div>
            <div class="d-flex flex-wrap gap-2">
              <input id="campo-busca" type="search" class="form-control form-control-sm campo-busca"
                     placeholder="Pesquisar por nome ou descrição...">
              <button class="btn btn-sm btn-primary" id="btn-novo">
                <i class="bi bi-plus-lg"></i> Novo procedimento
              </button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>Procedimento</th>
                  <th>Preço</th>
                  <th>Duração</th>
                  <th>Cadastrado em</th>
                  <th class="text-end">Ações</th>
                </tr>
              </thead>
              <tbody id="corpo-tabela"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- ================= MODAL CADASTRO / EDIÇÃO ================= -->
  <div class="modal fade" id="modal-procedimento" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="titulo-modal">Novo procedimento</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <form id="formulario-procedimento" class="needs-validation" novalidate>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label" for="nome">Nome do procedimento *</label>
                <input id="nome" name="nome" class="form-control" maxlength="80" required
                       placeholder="Ex.: Profilaxia (Limpeza)">
                <div class="invalid-feedback">Informe o nome do procedimento.</div>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="preco">Preço (R$) *</label>
                <input id="preco" name="preco" type="number" step="0.01" min="0" class="form-control" required
                       placeholder="150.00">
                <div class="invalid-feedback">Informe o preço do procedimento.</div>
              </div>
              <div class="col-md-8">
                <label class="form-label" for="descricao">Descrição</label>
                <input id="descricao" name="descricao" class="form-control" maxlength="200"
                       placeholder="Remoção de placa e cálculo...">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="duracao_minutos">Duração (minutos)</label>
                <input id="duracao_minutos" name="duracao_minutos" type="number" min="5" step="5"
                       class="form-control" value="30">
                <div class="invalid-feedback">Mínimo de 5 minutos.</div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/procedimentos.js"></script>
</body>
</html>
